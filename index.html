<!DOCTYPE html>
<html lang="en-gb">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Weather Dashboard</title>

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
</head>

<body>
  <header class="container-fluid text-center text-black weather-header mb-5">
    <h1 class="display-4">Weather Dashboard</h1>
  </header>

  <main class="container-fluid" style="max-width: 1400px">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-lg-3 pb-3" aria-label="Search and history section">
        <h2 id="form-heading" class="h4 mt-1">Search for a City</h2>
        <form id="search-form" class="form mb-3" role="search" aria-labelledby="form-heading">
          <div class="input-group">
            <input type="text" id="search-input" class="form-control weather-search"
              placeholder="e.g. London" aria-label="City name" aria-describedby="search-button" />
            <div class="input-group-append">
              <button type="submit" id="search-button" class="btn search-button text-black" aria-label="Search city">
                Search
              </button>
            </div>
          </div>
        </form>

        <!-- Search history -->
        <div class="mb-3">
          <button class="btn btn-block" id="clear-history" aria-label="Clear search history">Clear History</button>
        </div>
        <div class="list-group" id="history" role="list" aria-label="Search history"></div>
      </aside>

      <!-- Main Content -->
      <div class="col-lg-9 pb-3">
        <!-- Today's Weather -->
        <section id="today" class="mt-3" role="region" aria-live="polite" aria-label="Current weather section"></section>

        <!-- Forecast Header -->
        <section id="forecast-title" class="mt-4 pt-2 text-center" role="region" aria-live="polite"></section>

        <!-- 5-Day Forecast -->
        <section id="forecast" class="row mt-3" role="region" aria-live="polite" aria-label="Five-day forecast"></section>
      </div>
    </div>
  </main>

  <!-- JavaScript -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script src="./assets/js/script.js"></script>
</body>

</html>
